<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA - Inteligência Regulatória</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">ARIA</div>
            <nav>Painel de Controle | Histórico | Configurações</nav>
        </header>

        <main>
            <section class="upload-area">
                <h1>Análise de Documentos Complexos</h1>
                <p>Arraste arquivos PDF da ANVISA ou FDA para análise GenAI</p>
                <button class="btn-upload">Upload de Documento</button>
            </section>

            <section class="chat-container">
                <div class="chat-window">
                    <div class="message system">
                        <strong>ARIA:</strong> Olá, Renata! Encontrei 3 novas atualizações normativas hoje. Deseja o resumo executivo?
                    </div>
                </div>
                <div class="input-area">
                    <input type="text" placeholder="Pergunte sobre conformidade ou dosagens...">
                    <button>Enviar</button>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
